services:
  backend-archery:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: backend-archery
    ports:
      - "8080:8080"
    environment:
      SPRING_DATA_MONGODB_URI: "mongodb://database-archery:27017/archerydb"
    depends_on:
      database-archery:
        condition: service_healthy
    networks:
      - archeryNetwork

  database-archery:
    image: mongo:7.0
    container_name: database-archery
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - archeryNetwork
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express
    environment:
      ME_CONFIG_MONGODB_URL: "mongodb://database-archery:27017"
      ME_CONFIG_BASICAUTH_USERNAME: "admin"
      ME_CONFIG_BASICAUTH_PASSWORD: "12345"
    ports:
      - "8081:8081"
    depends_on:
      database-archery:
        condition: service_healthy
    networks:
      - archeryNetwork

volumes:
  mongo_data:

networks:
  archeryNetwork:
    driver: bridge