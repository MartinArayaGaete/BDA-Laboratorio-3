services:
  backend-archery:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: backend-archery
    ports:
      - "${BACK_PORT:-8080}:8080"
    environment:
      APP_TIMEZONE: "${APP_TIMEZONE:-America/Santiago}"
      TZ: "${APP_TIMEZONE:-America/Santiago}"
      JAVA_TOOL_OPTIONS: "-Duser.timezone=${APP_TIMEZONE:-America/Santiago}"
      MONGO_URI: "mongodb://database-archery:27017/archerydb"
    depends_on:
      database-archery:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - archeryNetwork

  database-archery:
    image: mongo:7.0
    container_name: database-archery
    environment:
      MONGO_INITDB_DATABASE: "archerydb"
    volumes:
      - archeryMongoData:/data/db
    ports:
      - "27017:27017"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - archeryNetwork

  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express
    environment:
      ME_CONFIG_MONGODB_URL: "mongodb://database-archery:27017"
      ME_CONFIG_BASICAUTH_USERNAME: "admin"
      ME_CONFIG_BASICAUTH_PASSWORD: "12345"
    ports:
      - "8081:8081"
    depends_on:
      database-archery:
        condition: service_healthy
    networks:
      - archeryNetwork

volumes:
  archeryMongoData:
    driver: local

networks:
  archeryNetwork:
    driver: bridge