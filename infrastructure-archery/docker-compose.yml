services:
  frontend-archery:
    build:
      context: ../frontend/mi-app
      dockerfile: Dockerfile
    container_name: frontend-archery
    ports:
      - "${FRONT_PORT:-3000}:3000"
    environment:
      TZ: "${APP_TIMEZONE:-America/Santiago}"
    volumes:
      - ../frontend/mi-app:/app
      - /app/node_modules
    restart: unless-stopped
    networks:
      - archeryNetwork

  backend-archery:
    build:
      context: ../backend/demo
      dockerfile: Dockerfile
    container_name: backend-archery
    ports:
       - "${BACK_PORT:-8080}:8080"
    environment:
      APP_TIMEZONE: "${APP_TIMEZONE:-America/Santiago}"
      TZ: "${APP_TIMEZONE:-America/Santiago}"
      JAVA_TOOL_OPTIONS: "-Duser.timezone=${APP_TIMEZONE:-America/Santiago}"
      POSTGRES_HOST: "${POSTGRES_HOST:-database-archery}"
      POSTGRES_PORT: "${POSTGRES_PORT:-5432}"
      POSTGRES_DB: "${POSTGRES_DB:-archeryDb}"
      POSTGRES_USER: "${POSTGRES_USER:-archeryUser}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-12345}"
    depends_on:
      database-archery:
        condition: service_healthy
      mongo-archery:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - archeryNetwork

  database-archery:
    image: postgis/postgis:16-3.4-alpine
    container_name: database-archery
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-archeryDb}"
      POSTGRES_USER: "${POSTGRES_USER:-archeryUser}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-12345}"
      TZ: "${APP_TIMEZONE:-America/Santiago}"
      PGTZ: "${APP_TIMEZONE:-America/Santiago}"
    volumes:
      - archeryPostgresData:/var/lib/postgresql/data
      - ../database/sql:/docker-entrypoint-initdb.d
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-archeryUser} -d ${POSTGRES_DB:-archeryDb}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - archeryNetwork

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: "${PGADMIN_DEFAULT_EMAIL:-example@gmail.com}"
      PGADMIN_DEFAULT_PASSWORD: "${PGADMIN_DEFAULT_PASSWORD:-12345}"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      - database-archery
    networks:
      - archeryNetwork


  mongo-archery:
    image: mongo:7.0
    container_name: mongo-archery
    command: [ "mongod", "--replSet", "rs0", "--bind_ip_all" ]
    environment:
      MONGO_INITDB_DATABASE: "archerydb"
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - archeryNetwork
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-archery-secondary:
    image: mongo:7.0
    container_name: mongo-archery-secondary
    command: [ "mongod", "--replSet", "rs0", "--bind_ip_all" ]
    volumes:
      - mongo_secondary_data:/data/db
    ports:
      - "27018:27017"
    networks:
      - archeryNetwork
    healthcheck:
      test: [ "CMD-SHELL", "mongosh --quiet --eval 'try { quit(rs.status().myState === 2 ? 0 : 1) } catch (error) { quit(1) }'" ]
      interval: 10s
      timeout: 5s
      retries: 10

  mongo-replica-set-init:
    image: mongo:7.0
    container_name: mongo-replica-set-init
    depends_on:
      - mongo-archery
      - mongo-archery-secondary
    entrypoint:
      - bash
      - -c
      - |
        until mongosh --host mongo-archery --quiet --eval "quit(db.adminCommand('ping').ok ? 0 : 1)"; do sleep 2; done
        until mongosh --host mongo-archery-secondary --quiet --eval "quit(db.adminCommand('ping').ok ? 0 : 1)"; do sleep 2; done
        mongosh --host mongo-archery --quiet --eval '
        try { void rs.status(); } catch (error) {
        if (error.codeName !== "NotYetInitialized") { throw error; }
        rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "mongo-archery:27017", priority: 2 }, { _id: 1, host: "mongo-archery-secondary:27017", priority: 1 }] }); }'
        until mongosh --host mongo-archery --quiet --eval 'quit(rs.status().members.every(m => m.health === 1) ? 0 : 1)'; do sleep 2; done
        echo "Replica Set ready"
        mongosh "mongodb://mongo-archery:27017,mongo-archery-secondary:27017/archerydb?replicaSet=rs0" /scripts/configs/01-SchemaValidation.js
        mongosh "mongodb://mongo-archery:27017,mongo-archery-secondary:27017/archerydb?replicaSet=rs0" /scripts/configs/02-Indexes.js
        mongosh "mongodb://mongo-archery:27017,mongo-archery-secondary:27017/archerydb?replicaSet=rs0" /scripts/configs/03-ArcherRendimientoPipeline.js
    volumes:
      - ../database/mongo:/scripts/configs:ro
    restart: "no"
    networks:
      - archeryNetwork

  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express
    environment:
      ME_CONFIG_MONGODB_URL: "mongodb://mongo-archery:27017,mongo-archery-secondary:27017/archerydb?replicaSet=rs0"
      ME_CONFIG_BASICAUTH_USERNAME: "admin"
      ME_CONFIG_BASICAUTH_PASSWORD: "12345"
    ports:
      - "8081:8081"
    depends_on:
      mongo-replica-set-init:
        condition: service_completed_successfully
    networks:
      - archeryNetwork

volumes:
  archeryPostgresData:
    name: archeryPostgresData
    driver: local
  mongo_data:
  mongo_secondary_data:

networks:
  archeryNetwork:
    name: archeryNetwork
    driver: bridge
